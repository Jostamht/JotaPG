<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · .JotaPG</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="login">
  <header class="header">
    <a class="logo" href="/"><span class="dot">.</span>JotaPG</a>
  </header>

  <main>
    <section class="hero small">
      <h1>Entrar a tu panel</h1>
      <p>Escribe el código que te enviamos para ver las confirmaciones de tus invitados.</p>
    </section>

    <!-- Al enviar el formulario, login.js manda el código a /api/login -->
    <form id="login-form" class="form">
      <label for="code">Tu código</label>
      <!-- El código se escribe oculto; el botón del ojo lo muestra u oculta (login.js) -->
      <div class="password-field">
        <input id="code" name="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
        <button type="button" id="toggle-code" class="pw-toggle" aria-label="Mostrar el código" aria-controls="code" aria-pressed="false" title="Mostrar el código">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a17.8 17.8 0 0 1 4.06-5.06M9.9 5.24A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.7 17.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M2 2l20 20"/>
          </svg>
        </button>
      </div>
      <button type="submit">Entrar</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
